<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Synergy - PokeMMO</title>
  <!--
    GitHub Pages does not serve a document for BrowserRouter deep links.  Keep
    the project-site prefix when forwarding the unknown route to index.html;
    otherwise /team-site/pokedex/ would incorrectly become /?/team-site/pokedex/.
  -->
  <script>
    (function () {
      var location = window.location
      var basePath = '/team-site'
      var route = location.pathname.indexOf(basePath + '/') === 0
        ? location.pathname.slice(basePath.length)
        : location.pathname

      location.replace(
        location.protocol + '//' + location.host + basePath + '/?/' +
        route.replace(/^\//, '').replace(/&/g, '~and~') +
        (location.search ? '&' + location.search.slice(1).replace(/&/g, '~and~') : '') +
        location.hash
      )
    })()
  </script>
</head>
<body></body>
</html>
